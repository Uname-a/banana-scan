# SPDX-License-Identifier: AGPL-3.0-only
# `docker compose up -d --build`, then open http://localhost:8080
#
# banana-scan-mcp, the agent connection, is not started by `up`: the agent
# starts it, talking over stdin and stdout. See docs/docker.md.
#   docker compose run --rm banana-scan-mcp --pair      the pairing link
#   docker compose -f <this file> run --rm -T --service-ports banana-scan-mcp
#                                                     the agent's command
services:
  banana-scan:
    build:
      context: .
      args:
        VITE_FILES_URL: ${BANANA_SCAN_FILES_URL:-}
    image: banana-scan
    ports:
      - "${BANANA_SCAN_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  banana-scan-mcp:
    profiles: [mcp]
    build: ./mcp
    image: banana-scan-mcp
    init: true
    stdin_open: true
    # The tab connects here: on this computer only.
    ports:
      - "127.0.0.1:7317:7317"
    # Where exports land and files are read from, at the same path as on
    # this computer, so the paths the agent names are the same on both.
    volumes:
      - banana-scan-mcp:/config
      - ${BANANA_SCAN_FILES:-${HOME}/BananaScan}:${BANANA_SCAN_FILES:-${HOME}/BananaScan}
    working_dir: ${BANANA_SCAN_FILES:-${HOME}/BananaScan}
    # --app in the entrypoint, so that what `run` is given goes after it.
    entrypoint: ["node", "/opt/banana-scan-mcp/bin/banana-scan-mcp.js", "--app", "http://localhost:${BANANA_SCAN_PORT:-8080}/"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  banana-scan-mcp:
    name: banana-scan-mcp
