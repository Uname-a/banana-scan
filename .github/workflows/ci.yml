# SPDX-License-Identifier: AGPL-3.0-only
# Test-and-build gate. It costs some 100 runner-minutes, so it runs after a
# merge into main and by hand only (`gh workflow run ci.yml --ref dev`), not on
# every pull request; run the checks in AGENTS.md locally before one.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests in four parts, side by side. The runner has two cores, so
  # vitest runs one file at a time there: all of them in one job took 17-20
  # minutes and grew into the time limit.
  unit-tests:
    name: unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nothing outside plugins/ imports from it
        run: node scripts/check-plugin-boundary.mjs
      - name: Lengths on screen go through the display units
        run: node scripts/check-units.mjs
      - name: The agent server (mcp/), its own package
        run: npm --prefix mcp ci && npm --prefix mcp test
      - run: npm run build
      - name: Each worker gets the Content-Security-Policy its code needs
        run: node scripts/check-csp.mjs
      - name: Browser regression checks and production smoke test
        run: npm run e2e:ci
      - name: Retain browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: e2e-out/ci/
          if-no-files-found: ignore
          retention-days: 7
