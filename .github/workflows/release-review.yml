# SPDX-License-Identifier: AGPL-3.0-only
# A pull request into `main` is a release: the owner reviews and merges it.
# It is often opened under the owner's own account, by an agent working for
# them, and GitHub notifies no one of their own actions — so this asks for
# the review in a comment that mentions the owner, which does notify. It
# reads nothing from the pull request but its number and commit count, and
# runs nothing from it.
name: Release review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  ask:
    # Only a release from this repository's own branch, never from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the owner to review and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "@$OWNER this release needs your review: $COMMITS commits from \`$HEAD\` into \`main\`. Merge it with a merge commit once its checks pass; CI then runs on \`main\`."
