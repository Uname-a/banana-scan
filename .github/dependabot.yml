# SPDX-License-Identifier: AGPL-3.0-only
# Dependency updates, as pull requests into dev (work reaches main only from
# dev). Grouped so a week's minor and patch updates are one pull request per
# package; majors come one by one. A new dependency's licence still has to pass
# the allowlist (license-check.yml) before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mcp
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
